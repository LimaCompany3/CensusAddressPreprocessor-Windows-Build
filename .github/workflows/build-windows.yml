name: Build Windows Executable and SQL CLR DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile self-contained 64-bit Windows application
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc /MT CensusAddressPreprocessor.cpp /Fe:CensusAddressPreprocessor.exe /link /SUBSYSTEM:WINDOWS comdlg32.lib user32.lib
      - name: Compile national Complete CSV merger
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc /MT DLL_703854028M_Complete_CSV_Merger.cpp /Fe:DLL_703854028M_Complete_CSV_Merger.exe /link /SUBSYSTEM:WINDOWS user32.lib
      - name: Compile SQL CLR DLL for .NET Framework 4.8
        shell: cmd
        run: msbuild DLL_703854028M\DLL_703854028M.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
      - name: Verify binaries
        shell: pwsh
        run: |
          if (-not (Test-Path .\CensusAddressPreprocessor.exe)) { throw "Executable was not produced." }
          if (-not (Test-Path .\DLL_703854028M\bin\Release\DLL_703854028M.dll)) { throw "DLL was not produced." }
          Get-Item .\CensusAddressPreprocessor.exe, .\DLL_703854028M\bin\Release\DLL_703854028M.dll | Format-Table Name,Length,LastWriteTime
      - name: Assemble easy-download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\Package | Out-Null
          New-Item -ItemType Directory -Force -Path .\Package\Source | Out-Null
          New-Item -ItemType Directory -Force -Path .\Package\SQL | Out-Null
          Copy-Item .\CensusAddressPreprocessor.exe .\Package\CensusAddressPreprocessor.exe
          Copy-Item .\DLL_703854028M\bin\Release\DLL_703854028M.dll .\Package\DLL_703854028M.dll
          Copy-Item .\CensusAddressPreprocessor.cpp .\Package\Source\CensusAddressPreprocessor.cpp
          Copy-Item .\DLL_703854028M\DLL_703854028M.cs .\Package\Source\DLL_703854028M.cs
          Copy-Item .\DLL_703854028M\DLL_703854028M.csproj .\Package\Source\DLL_703854028M.csproj
          Copy-Item .\SQL\*.sql .\Package\SQL\
          Copy-Item .\README.txt .\Package\README.txt
          Copy-Item .\DLL_703854028M_Complete_Census_Address_Lookup_Architecture.pdf .\Package\DLL_703854028M_Complete_Census_Address_Lookup_Architecture.pdf
          Get-ChildItem .\Package -Recurse | Format-Table FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: DLL_703854028M_Complete_Address_Lookup_Package
          path: Package
          if-no-files-found: error
          retention-days: 30
